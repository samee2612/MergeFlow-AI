<svg width="1100" height="720" viewBox="0 0 1100 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #111827; }
    .sub { font: 400 15px Arial, sans-serif; fill: #4b5563; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .queue { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .worker { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .stop { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; }
    .decision { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    .h { font: 700 17px Arial, sans-serif; fill: #111827; }
    .t { font: 400 13px Arial, sans-serif; fill: #374151; }
    .label { font: 700 13px Arial, sans-serif; fill: #111827; }
    .small { font: 400 12px Arial, sans-serif; fill: #6b7280; }
    .arrow { stroke: #374151; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="white"/>

  <text x="50" y="50" class="title">MergeFlow AI Day 1 Flow</text>
  <text x="50" y="78" class="sub">Simple view: what calls what, and what gets passed along.</text>

  <rect x="50" y="130" width="190" height="100" rx="14" class="box"/>
  <text x="75" y="162" class="h">GitHub PR</text>
  <text x="75" y="188" class="t">Merged PR</text>
  <text x="75" y="208" class="t">Label: mergeflow: full</text>

  <line x1="240" y1="180" x2="330" y2="180" class="arrow"/>
  <text x="258" y="155" class="label">sends webhook</text>
  <text x="258" y="172" class="small">PR JSON + signature</text>

  <rect x="330" y="130" width="190" height="100" rx="14" class="box"/>
  <text x="355" y="162" class="h">ngrok</text>
  <text x="355" y="188" class="t">Public HTTPS URL</text>
  <text x="355" y="208" class="t">Forwards to your Mac</text>

  <line x1="520" y1="180" x2="610" y2="180" class="arrow"/>
  <text x="535" y="155" class="label">hits local API</text>
  <text x="535" y="172" class="small">POST localhost:8000/webhook</text>

  <rect x="610" y="130" width="220" height="100" rx="14" class="box"/>
  <text x="635" y="162" class="h">FastAPI</text>
  <text x="635" y="188" class="t">POST /webhook</text>
  <text x="635" y="208" class="t">Validates + filters</text>

  <line x1="720" y1="230" x2="720" y2="295" class="arrow"/>
  <text x="735" y="260" class="label">checks event</text>

  <polygon points="720,310 840,375 720,440 600,375" class="decision"/>
  <text x="664" y="368" class="h">Merged PR</text>
  <text x="648" y="390" class="h">with label?</text>

  <line x1="840" y1="375" x2="930" y2="375" class="arrow"/>
  <text x="862" y="355" class="label">no</text>
  <rect x="930" y="330" width="130" height="90" rx="14" class="stop"/>
  <text x="958" y="366" class="h">Ignore</text>
  <text x="950" y="392" class="t">200 ignored</text>

  <line x1="720" y1="440" x2="720" y2="505" class="arrow"/>
  <text x="735" y="475" class="label">yes</text>
  <text x="735" y="493" class="small">extract PR details</text>

  <rect x="580" y="520" width="280" height="105" rx="14" class="box"/>
  <text x="605" y="552" class="h">FastAPI extracts</text>
  <text x="605" y="578" class="t">repo, PR number, title, body</text>
  <text x="605" y="598" class="t">branch, labels, diff URL, author</text>

  <line x1="580" y1="572" x2="445" y2="572" class="arrow"/>
  <text x="470" y="546" class="label">queues task</text>
  <text x="455" y="564" class="small">run_pipeline.delay(...)</text>

  <rect x="260" y="520" width="185" height="105" rx="14" class="queue"/>
  <text x="300" y="552" class="h">Redis</text>
  <text x="290" y="578" class="t">Stores Celery task</text>
  <text x="288" y="598" class="t">until worker picks it up</text>

  <line x1="260" y1="572" x2="150" y2="572" class="arrow"/>
  <text x="172" y="546" class="label">worker pulls</text>
  <text x="160" y="564" class="small">task + arguments</text>

  <rect x="35" y="520" width="115" height="105" rx="14" class="worker"/>
  <text x="58" y="552" class="h">Celery</text>
  <text x="58" y="578" class="t">Runs</text>
  <text x="52" y="598" class="t">run_pipeline</text>

  <rect x="50" y="650" width="1010" height="45" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="70" y="678" class="label">Success logs:</text>
  <text x="170" y="678" class="t">ngrok POST 200 OK  →  FastAPI accepted/enqueued  →  Celery received/succeeded</text>
</svg>
