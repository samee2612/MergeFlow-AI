<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #111827; }
    .sub { font: 400 15px Arial, sans-serif; fill: #4b5563; }
    .lane-title { font: 700 19px Arial, sans-serif; fill: #111827; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .api { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .queue { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .worker { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .ai { fill: #fdf4ff; stroke: #c026d3; stroke-width: 2; }
    .github { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    .stop { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
    .error { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
    .h { font: 700 16px Arial, sans-serif; fill: #111827; }
    .t { font: 400 13px Arial, sans-serif; fill: #374151; }
    .small { font: 400 12px Arial, sans-serif; fill: #6b7280; }
    .label { font: 700 12px Arial, sans-serif; fill: #111827; }
    .arrow { stroke: #374151; stroke-width: 2.5; marker-end: url(#arrow); }
    .soft-arrow { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#redArrow); }
    .lane { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="white"/>

  <text x="50" y="48" class="title">MergeFlow AI Day 2 Flow</text>
  <text x="50" y="76" class="sub">Core pipeline: PR opened triggers pre-merge review, PR merged triggers post-merge automation.</text>

  <rect x="45" y="105" width="1310" height="130" rx="18" class="lane"/>
  <text x="70" y="137" class="lane-title">Shared Webhook Gate</text>

  <rect x="80" y="160" width="180" height="55" rx="12" class="github"/>
  <text x="112" y="183" class="h">GitHub PR Event</text>
  <text x="116" y="204" class="t">opened or closed</text>

  <line x1="260" y1="188" x2="335" y2="188" class="arrow"/>
  <text x="274" y="174" class="label">POST /webhook</text>

  <rect x="335" y="160" width="205" height="55" rx="12" class="api"/>
  <text x="382" y="183" class="h">FastAPI</text>
  <text x="367" y="204" class="t">Validate signature</text>

  <line x1="540" y1="188" x2="615" y2="188" class="arrow"/>

  <polygon points="705,145 800,188 705,230 610,188" class="decision"/>
  <text x="656" y="184" class="h">mergeflow:</text>
  <text x="670" y="205" class="h">label?</text>

  <line x1="800" y1="188" x2="885" y2="188" class="arrow"/>
  <text x="825" y="174" class="label">no</text>
  <rect x="885" y="160" width="140" height="55" rx="12" class="stop"/>
  <text x="924" y="183" class="h">Ignore</text>
  <text x="911" y="204" class="t">200 ignored</text>

  <line x1="705" y1="230" x2="705" y2="270" class="arrow"/>
  <text x="720" y="254" class="label">yes</text>

  <polygon points="705,280 815,330 705,380 595,330" class="decision"/>
  <text x="660" y="326" class="h">PR action?</text>
  <text x="642" y="347" class="t">opened or merged</text>

  <rect x="45" y="420" width="615" height="410" rx="18" class="lane"/>
  <text x="70" y="453" class="lane-title">Opened PR: Pre-Merge Review</text>

  <line x1="595" y1="330" x2="350" y2="330" class="arrow"/>
  <line x1="350" y1="330" x2="350" y2="485" class="arrow"/>
  <text x="386" y="318" class="label">opened</text>

  <rect x="95" y="485" width="200" height="70" rx="14" class="api"/>
  <text x="126" y="512" class="h">Fetch PR Diff</text>
  <text x="125" y="534" class="t">from diff_url</text>

  <line x1="295" y1="520" x2="370" y2="520" class="arrow"/>

  <rect x="370" y="485" width="215" height="70" rx="14" class="queue"/>
  <text x="404" y="512" class="h">Queue Review</text>
  <text x="395" y="534" class="t">run_pre_merge_review</text>

  <line x1="478" y1="555" x2="478" y2="610" class="arrow"/>

  <rect x="370" y="610" width="215" height="78" rx="14" class="worker"/>
  <text x="423" y="638" class="h">Celery</text>
  <text x="400" y="660" class="t">Run self reviewer</text>

  <line x1="370" y1="650" x2="295" y2="650" class="arrow"/>

  <rect x="95" y="610" width="200" height="78" rx="14" class="ai"/>
  <text x="134" y="638" class="h">Gemini Review</text>
  <text x="122" y="660" class="t">Find risks in diff</text>

  <line x1="195" y1="688" x2="195" y2="740" class="arrow"/>

  <rect x="95" y="740" width="490" height="60" rx="14" class="github"/>
  <text x="125" y="765" class="h">Post PR Comment</text>
  <text x="125" y="786" class="t">Structured findings, or Self review passed if clean</text>

  <rect x="740" y="420" width="615" height="410" rx="18" class="lane"/>
  <text x="765" y="453" class="lane-title">Merged PR: Post-Merge Pipeline</text>

  <line x1="815" y1="330" x2="1045" y2="330" class="arrow"/>
  <line x1="1045" y1="330" x2="1045" y2="485" class="arrow"/>
  <text x="930" y="318" class="label">closed and merged</text>

  <rect x="790" y="485" width="195" height="70" rx="14" class="queue"/>
  <text x="834" y="512" class="h">Queue Pipeline</text>
  <text x="825" y="534" class="t">run_pipeline.delay</text>

  <line x1="985" y1="520" x2="1060" y2="520" class="arrow"/>

  <rect x="1060" y="485" width="220" height="70" rx="14" class="worker"/>
  <text x="1117" y="512" class="h">Celery Worker</text>
  <text x="1090" y="534" class="t">Run isolated steps</text>

  <line x1="1170" y1="555" x2="1170" y2="600" class="arrow"/>

  <rect x="1060" y="600" width="220" height="60" rx="14" class="api"/>
  <text x="1105" y="625" class="h">Fetch Full Diff</text>
  <text x="1098" y="646" class="t">and changed files</text>

  <line x1="1060" y1="630" x2="985" y2="630" class="arrow"/>

  <rect x="790" y="600" width="195" height="60" rx="14" class="ai"/>
  <text x="831" y="625" class="h">Classify Diff</text>
  <text x="814" y="646" class="t">api/frontend/db/infra/mixed</text>

  <line x1="888" y1="660" x2="888" y2="700" class="arrow"/>

  <rect x="790" y="700" width="195" height="60" rx="14" class="github"/>
  <text x="819" y="725" class="h">Move Issue Done</text>
  <text x="817" y="746" class="t">body, branch, title</text>

  <line x1="985" y1="730" x2="1060" y2="730" class="arrow"/>

  <rect x="1060" y="700" width="220" height="60" rx="14" class="github"/>
  <text x="1100" y="725" class="h">Detect Env Vars</text>
  <text x="1090" y="746" class="t">update .env.example + comment</text>

  <line x1="1170" y1="760" x2="1170" y2="800" class="arrow"/>

  <rect x="1060" y="800" width="220" height="55" rx="14" class="worker"/>
  <text x="1108" y="823" class="h">Final Log</text>
  <text x="1087" y="844" class="t">timing, result, error count</text>

  <rect x="790" y="800" width="195" height="55" rx="14" class="error"/>
  <text x="821" y="823" class="h">Step Failure?</text>
  <text x="815" y="844" class="t">log error and continue</text>

  <line x1="888" y1="660" x2="888" y2="800" class="soft-arrow"/>
  <line x1="888" y1="760" x2="888" y2="800" class="soft-arrow"/>
  <line x1="1060" y1="730" x2="985" y2="828" class="soft-arrow"/>
  <line x1="985" y1="828" x2="1060" y2="828" class="soft-arrow"/>

  <text x="50" y="870" class="small">Day 2 key idea: opened PRs get review feedback before merge; merged PRs run post-merge automation with step-level error isolation.</text>
</svg>
